<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KafkaDesk · 简易 Kafka 客户端</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/logo.png" sizes="512x512" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    // Resolve the theme before the first paint so a dark setup never flashes white.
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('kafka-desk-theme') || 'system'; } catch (e) {}
      if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
      var dark = false;
      try { dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) {}
      var root = document.documentElement;
      root.setAttribute('data-theme-mode', mode);
      root.setAttribute('data-theme', mode === 'system' ? (dark ? 'dark' : 'light') : mode);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
